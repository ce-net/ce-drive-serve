[package]
name = "ce-drive-serve"
version = "0.1.0"
edition = "2024"
description = "CE Drive host — serves the ce-drive/v1 AppRequest op set over the CE mesh, authorizing every request against a presented ce-cap chain. An app over CE primitives (AppRequest + blobs + ce-cap); no node changes."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/ce-drive"
authors = ["Leif Rydenfalk <ledamecrydenfalk@gmail.com>"]

[lib]
name = "ce_drive_serve"
path = "src/lib.rs"

[[bin]]
name = "ce-drive-serve"
path = "src/main.rs"

[dependencies]
# --- CE substrate (siblings in the ~/ce-net workspace; by path) ---
ce-rs = { git = "https://github.com/ce-net/ce-rs" }                            # mesh transport (request/reply/publish) + blobs
ce-iam-core = { git = "https://github.com/ce-net/ce-iam" }
ce-identity = { git = "https://github.com/ce-net/ce" }     # Ed25519 identity (the drive host = the cap root)
ce-drive-core = { git = "https://github.com/ce-net/ce-drive" } # DriveTree CRDT + content map + share vocab

# --- async + error + serde ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures-util = "0.3"                                     # consume the push message stream
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "5"

[dev-dependencies]
tempfile = "3"
proptest = "1"
# In-process CE nodes for the two-node e2e test (same harness rdev/ce-node tests use).
ce-node = { git = "https://github.com/ce-net/ce" }
# The remote client, to drive the host loop end-to-end. Dev-only, so the dependency cycle
# (client -> serve) does not affect the normal build graph (Cargo permits dev-dep cycles).
ce-drive-client = { git = "https://github.com/ce-net/ce-drive-client" }

# NO [patch] SECTION, DELIBERATELY — do not reintroduce one.
#
# ce-coord and rdev (pulled transitively via ce-drive-core) reach ce-rs / ce-identity by GIT, and the
# whole graph must collapse onto ONE ce-rs (one CeClient, one data::Manifest, one cid) so those types
# stay identical across crates. Back when the deps above were `path = "../ce-rs"`, that unification
# needed a [patch] redirecting the git URL onto the path copy.
#
# The deps are git deps on the SAME URLs now, so cargo unifies them on its own and the patch is
# obsolete. Worse than obsolete: the sweep that converted the deps rewrote the patch VALUES too, so
# each entry patched a source to ITSELF and cargo refuses the manifest outright —
#   error: patch for `ce-cap` points to the same source, but patches must point to different sources
# which made this repo unbuildable from a clean checkout while still building here, because
# `tools/ce-dev-link` writes a .cargo/config.toml whose real path patches masked it.
#
# Local development still gets working-tree sources: that is exactly what ce-dev-link's generated,
# git-excluded .cargo/config.toml is for. It belongs there and NOT here, because it is per-machine.
